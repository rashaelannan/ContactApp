<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Contacts{% endblock %}</title>
    <style>
      body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      nav a { margin-right: 12px; }
      input, button { padding: 6px 10px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
  </head>
  <body>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'contact_list' %}">Home</a>
        <a href="{% url 'contact_create' %}">Add Contact</a>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
  </body>
</html>

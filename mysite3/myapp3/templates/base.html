<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Doctor Contacts{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body { padding-top: 70px; }
        .table thead th { white-space: nowrap; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'contact_list' %}">Doctor Finder</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact_list' %}">All Doctors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'recommend_contacts' %}">
            Recommendations
          </a>
        </li>
      </ul>

      {% if user.is_authenticated %}
        <span class="navbar-text me-3">
          Logged in as {{ user.username }}
        </span>

        <!-- Logout must be POST -->
        <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm me-2"
           href="{% url 'login' %}">
          Login
        </a>
        <a class="btn btn-light btn-sm"
           href="{% url 'signup' %}">
          Sign up
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
